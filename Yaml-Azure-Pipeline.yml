trigger:
- main

pool:
  vmImage: 'windows-latest'

variables:
  - group: 'vcenter-credentials'
  - name: vmDefinitionFile
    value: 'cluster-vms.yaml'

steps:
- powershell: |
    Install-Module -Name powershell-yaml -Force -Scope CurrentUser
    Install-Module -Name VMware.PowerCLI -Force -Scope CurrentUser
  displayName: 'Install required modules'

- powershell: |
    .\Build-Cluster.ps1 `
      -DefinitionPath "$(vmDefinitionFile)" `
      -VcenterServer "$(VCENTER_SERVER)" `
      -VcenterCluster "$(VCENTER_CLUSTER)" `
      -PlanOnly
  env:
    AZURE_DEVOPS_PAT: $(AZURE_DEVOPS_PAT)
  displayName: 'Validate and plan VM build'

# Remove -PlanOnly only after the plan artifact is reviewed and the agent has network access to vCenter.
- powershell: |
    $cred = [pscredential]::new(
      "$(VCENTER_USER)",
      (ConvertTo-SecureString "$(VCENTER_PASS)" -AsPlainText -Force)
    )

    .\Build-Cluster.ps1 `
      -DefinitionPath "$(vmDefinitionFile)" `
      -VcenterServer "$(VCENTER_SERVER)" `
      -VcenterCluster "$(VCENTER_CLUSTER)" `
      -VcenterCredential $cred `
      -WhatIf
  env:
    AZURE_DEVOPS_PAT: $(AZURE_DEVOPS_PAT)
  displayName: 'Preview vCenter actions'
