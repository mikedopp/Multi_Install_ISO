# Sample four-node cluster: two IIS front ends and two API servers on Windows Server 2022.
# Replace datastores, networks, addresses, and the ISO path before building media.
# vSphere CD drives need a datastore path: "[datastore] folder/file.iso".
vms:
  - vmname: "iis-web-01"
    description: "IIS frontend server 1"
    iso: "[datastore1] iso/en_windows_server_2022_x64.iso"
    imageName: "Windows Server 2022 SERVERSTANDARD"
    os: "windows2019srvNext_64Guest"   # Windows Server 2022
    cpu: 4
    ramGB: 8
    diskGB: 60
    datastore: "datastore1"
    network: "VM Network"
    ip: "192.168.10.11"
    subnet: "255.255.255.0"
    gateway: "192.168.10.1"
    dns: ["192.168.10.10", "8.8.8.8"]
    domain: "contoso.local"
    roles: ["IIS"]
    codeRepo: "https://dev.azure.com/yourorg/yourproject/_git/webapp"
    appPoolName: "WebAppPool"
    siteName: "WebSite"

  - vmname: "iis-web-02"
    description: "IIS frontend server 2"
    iso: "[datastore1] iso/en_windows_server_2022_x64.iso"
    imageName: "Windows Server 2022 SERVERSTANDARD"
    os: "windows2019srvNext_64Guest"   # Windows Server 2022
    cpu: 4
    ramGB: 8
    diskGB: 60
    datastore: "datastore1"
    network: "VM Network"
    ip: "192.168.10.12"
    subnet: "255.255.255.0"
    gateway: "192.168.10.1"
    dns: ["192.168.10.10", "8.8.8.8"]
    domain: "contoso.local"
    roles: ["IIS"]
    codeRepo: "https://dev.azure.com/yourorg/yourproject/_git/webapp"
    appPoolName: "WebAppPool"
    siteName: "WebSite"

  - vmname: "api-app-01"
    description: "API server 1"
    iso: "[datastore1] iso/en_windows_server_2022_x64.iso"
    imageName: "Windows Server 2022 SERVERSTANDARD"
    os: "windows2019srvNext_64Guest"   # Windows Server 2022
    cpu: 4
    ramGB: 8
    diskGB: 60
    datastore: "datastore1"
    network: "VM Network"
    ip: "192.168.10.13"
    subnet: "255.255.255.0"
    gateway: "192.168.10.1"
    dns: ["192.168.10.10", "8.8.8.8"]
    domain: "contoso.local"
    roles: ["API"]
    codeRepo: "https://dev.azure.com/yourorg/yourproject/_git/webapi"
    siteName: "ApiService"

  - vmname: "api-app-02"
    description: "API server 2"
    iso: "[datastore1] iso/en_windows_server_2022_x64.iso"
    imageName: "Windows Server 2022 SERVERSTANDARD"
    os: "windows2019srvNext_64Guest"   # Windows Server 2022
    cpu: 4
    ramGB: 8
    diskGB: 60
    datastore: "datastore1"
    network: "VM Network"
    ip: "192.168.10.14"
    subnet: "255.255.255.0"
    gateway: "192.168.10.1"
    dns: ["192.168.10.10", "8.8.8.8"]
    domain: "contoso.local"
    roles: ["API"]
    codeRepo: "https://dev.azure.com/yourorg/yourproject/_git/webapi"
    siteName: "ApiService"
