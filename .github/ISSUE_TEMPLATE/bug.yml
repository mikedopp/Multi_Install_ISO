name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown on the version button in the app.
      placeholder: "1.2.3"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Optional. The app's Copy diagnostics button. Read it first and remove anything private.
      render: text
